name: tmopen-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: tmopen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmopen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:-tmopen}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmopen} -d ${POSTGRES_DB:-tmopen}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    networks:
      - tmopen-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: tmopen-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmopen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tmopen}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/${POSTGRES_DB:-tmopen}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/api-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    networks:
      - tmopen-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
    name: tmopen-postgres-data

networks:
  tmopen-net:
    name: tmopen-net
    driver: bridge
