services:
  postgres:
    image: postgres:16-alpine
    container_name: tmopen-postgres
    environment:
      POSTGRES_USER: tmopen
      POSTGRES_PASSWORD: tmopen
      POSTGRES_DB: tmopen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmopen -d tmopen"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmopen-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://tmopen:tmopen@postgres:5432/tmopen?schema=public"
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
